name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installed here only, so your website's package.json is not touched.
      - name: Install Capacitor
        run: npm install --no-save --no-package-lock @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3

      - name: Create Android project
        run: npx cap add android

      - name: Generate icon and splash
        run: npx capacitor-assets generate --android

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zenbiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
