name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installed here only, so your website's package.json is not touched.
      - name: Install Capacitor
        run: npm install --no-package-lock @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6 @capacitor/assets@3

      - name: Create Android project
        run: npx cap add android

      - name: Let Google sign-in return to the app
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          f = """<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="zenbiz" android:host="auth" />
              </intent-filter>
          </activity>"""
          open(p, "w").write(s.replace("</activity>", f, 1))
          PY

      - name: Allow the camera (barcode scanning)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = """<uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
          </manifest>"""
          open(p, "w").write(s.replace("</manifest>", perms, 1))
          PY

      # A higher build number every time, and (if the secret exists) the SAME signing key
      # every time: Android only installs an update over the old app when both match.
      - name: Version and signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/zenbiz.keystore
            {
              echo 'android {'
              echo '    signingConfigs { zen {'
              echo '        storeFile file("../zenbiz.keystore")'
              echo "        storePassword \"$KS_PASS\""
              echo '        keyAlias "zenbiz"'
              echo "        keyPassword \"$KS_PASS\""
              echo '    } }'
              echo '    buildTypes { debug { signingConfig signingConfigs.zen } }'
              echo '}'
            } >> android/app/build.gradle
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: the APK is signed with a random key, so it cannot update over an older install."
          fi

      - name: Generate icon and splash
        run: npx capacitor-assets generate --android

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zenbiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Public download link: .../releases/download/downloads/ZenBiz.apk
      - name: Publish to the downloads release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZenBiz.apk
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --title "Zen Biz downloads" --notes "Latest Android and Windows apps."
          echo '{"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}"}' > apk-version.json
          gh release upload downloads ZenBiz.apk apk-version.json --clobber
