name: Build Windows installer

on:
  push:
    branches: [main]
    # Only when the PC app itself changes (logo, window, installer). Website changes
    # reach it by themselves, with no update needed.
    paths:
      - "electron/**"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch: {}

concurrency:
  group: windows-exe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build installer
        working-directory: electron
        run: |
          # A higher version number every build, so installed apps see the update.
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
          npm install --no-package-lock
          npm install --no-package-lock --no-save electron@31 electron-builder@24
          npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: zenbiz-windows
          path: electron/dist/ZenBiz-Setup.exe

      # Public download link: .../releases/download/downloads/ZenBiz-Setup.exe
      - name: Publish to the downloads release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --title "Zen Biz downloads" --notes "Latest Android and Windows apps."
          gh release upload downloads electron/dist/ZenBiz-Setup.exe electron/dist/latest.yml --clobber
          # The blockmap lets installed apps download only what changed (optional).
          if [ -f electron/dist/ZenBiz-Setup.exe.blockmap ]; then gh release upload downloads electron/dist/ZenBiz-Setup.exe.blockmap --clobber; fi
